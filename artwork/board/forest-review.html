<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest border artwork review</title>
<style>body{font:16px system-ui;background:#eee7d6;color:#263725;margin:24px}p{max-width:43em}.board{display:grid;grid-template-columns:repeat(7,64px);gap:3px;width:max-content;padding:8px;background:#293d22}.cell{width:64px;height:64px;background-image:url('backgrounds/forest-canopy-tile-v1.png');background-size:256px 256px;background-position:calc(var(--x)*-67px) calc(var(--y)*-67px)}.open{background-image:url('backgrounds/woodland-floor-v1.png');background-size:256px 256px;display:grid;place-items:center}.open img{width:90%;height:90%;object-fit:contain;transform:scale(1.4)}</style>
<h1>Illustrated forest border</h1><p>Concept preview at 64 CSS pixels per grid square. The forest texture repeats across non-playable spaces; actual map shapes, gates and fog still need testing.</p><div class="board" id="board"></div>
<script>const a=['grove-sprout-v1','song-tier-2-v1','crystal-tier-2-v1','wood-tier-2-v1','elk-tier-2-v1','tool-tier-1-v1'];let b=document.querySelector('#board');for(let y=0;y<7;y++)for(let x=0;x<7;x++){let c=document.createElement('div');c.className='cell'+(x>=2&&x<=4&&y>=2&&y<=4?' open':'');c.style.setProperty('--x',x);c.style.setProperty('--y',y);if(c.classList.contains('open')&&a.length){let i=document.createElement('img');i.src='webp/'+a.shift()+'.webp';i.alt='';c.append(i)}b.append(c)}</script></html>
